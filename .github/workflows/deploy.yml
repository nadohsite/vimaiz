name: CI/CD Laravel + React Optimized

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VIMAIZ

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            echo "🔹 Déploiement commencé : $(date)"
            cd /var/www/vimaiz

            # Vérification commit
            echo "🔹 Checking new commits..."
            git fetch origin main

            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse origin/main)

            if [ "$LOCAL" != "$REMOTE" ]; then
              echo "🔹 Nouveau commit détecté → mise à jour"
              git reset --hard origin/main

              # ---- PHP / Composer ----
              echo "🔹 Installation des dépendances PHP"
              composer install --no-dev --optimize-autoloader

              # ---- Laravel ----
              echo "🔹 Migrations & optimisation Laravel"
              php artisan migrate --force
              php artisan optimize

              # ---- NPM / React / Vite ----
              echo "🔹 Installation et build du front"
              npm ci
              npm run build

              # ---- Restart services ----
              echo "🔹 Restart PHP-FPM"
              sudo systemctl restart php8.4-fpm
              php artisan queue:restart || true

              echo "✅ Déploiement terminé : $(date)"
            else
              echo "⚠️ Aucun nouveau commit → déploiement ignoré"
            fi
                