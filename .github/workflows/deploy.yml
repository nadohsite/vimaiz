name: CI/CD Laravel + React Optimized

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VIMAIZ

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            echo "🔹 Déploiement commencé : $(date)"
            cd /var/www/vimaiz

            # Récupération du dernier commit remote
            echo "🔹 Checking new commits..."
            git fetch origin main

            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse origin/main)

            if [ "$LOCAL" != "$REMOTE" ]; then
              echo "🔹 Nouveau commit détecté, pull..."
              git reset --hard origin/main

              echo "🔹 Détection des fichiers modifiés..."
              CHANGED_FILES=$(git diff --name-only $LOCAL $REMOTE)

              # ---- Composer ----
              if echo "$CHANGED_FILES" | grep -q "composer.lock"; then
                echo "🔹 Composer.lock changé → composer install"
                composer install --no-dev --optimize-autoloader
              else
                echo "⚠️ Aucun changement PHP → composer ignoré"
              fi

              # ---- Laravel ----
              echo "🔹 Migrations & cache Laravel"
              php artisan migrate --force
              php artisan optimize

              # ---- NPM/Vite ----
              if echo "$CHANGED_FILES" | grep -Eq "package.json|package-lock.json|resources"; then
                echo "🔹 Changement détecté dans le front → npm ci + build"
                npm ci
                npm run build
              else
                echo "⚠️ Aucun changement front → build ignoré"
              fi

              # ---- Services ----
              echo "🔹 Restart PHP-FPM"
              sudo systemctl restart php8.4-fpm

              php artisan queue:restart || true

              echo "✅ Déploiement terminé : $(date)"
            else
              echo "⚠️ Pas de nouveau commit → rien à déployer"
            fi
