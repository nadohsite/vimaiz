name: CI/CD Laravel + React Optimized

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permet un déclenchement manuel

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VIMAIZ

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            echo "🔹 Déploiement commencé : $(date)"
            cd /var/www/vimaiz

            git fetch origin main
            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse origin/main)

            if [ "$LOCAL" != "$REMOTE" ]; then
              echo "🔹 Nouveau commit détecté, mise à jour du code..."
              git reset --hard origin/main

              # Installer dépendances PHP uniquement si composer.lock a changé
              if git diff --name-only HEAD~1 HEAD | grep -q 'composer.lock'; then
                echo "🔹 Composer.lock changé, installation des dépendances PHP"
                composer install --no-dev --optimize-autoloader
              else
                echo "⚠️ Aucun changement dans composer.lock, installation PHP ignorée"
              fi

              # Migration base de données
              echo "🔹 Exécution des migrations"
              php artisan migrate --force

              # Clear / Cache config, routes, views
              echo "🔹 Cache configuration, routes et vues"
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache

              # Installer et build front uniquement si package.json ou package-lock.json ont changé
              if git diff --name-only HEAD~1 HEAD | grep -E 'package(-lock)?\.json'; then
                echo "🔹 Changement détecté côté front, installation npm et build"
                npm ci
                npm run build
              else
                echo "⚠️ Aucun changement dans le front, build ignoré"
              fi

              # Redémarrage services
              echo "🔹 Redémarrage PHP-FPM et queue"
              sudo systemctl restart php8.4-fpm
              php artisan queue:restart || true

              echo "✅ Déploiement terminé : $(date)"
            else
              echo "⚠️ Pas de nouveau commit, aucun déploiement nécessaire"
            fi
