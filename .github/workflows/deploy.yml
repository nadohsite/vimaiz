name: CI/CD Laravel + React Optimized

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VIMAIZ

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 🔹 Exit immediately on errors + afficher chaque commande
            set -ex

            # 🔹 Ajouter Composer au PATH
            export PATH="$PATH:/home/ubuntu/.config/herd-lite/bin"

            echo "🔹 Déploiement commencé : $(date)"
            cd /var/www/vimaiz

            # 🔹 Vérification des commits
            echo "🔹 Vérification des commits"
            git fetch origin main
            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse origin/main)

            echo "LOCAL HEAD: $LOCAL"
            echo "REMOTE HEAD: $REMOTE"

            if [ "$LOCAL" != "$REMOTE" ]; then
              echo "🔹 Nouveau commit détecté → pull et mise à jour"
              git reset --hard origin/main

              # ---- PHP / Composer ----
              echo "🔹 Installation des dépendances PHP"
              composer install --no-dev --optimize-autoloader

              # ---- Laravel migrations ----
              echo "🔹 Exécution des migrations"
              php artisan migrate --force

              # ---- NPM / React / Vite ----
              echo "🔹 Installation et build du front"
              npm ci
              npm run build

              # ---- Laravel cache & workers ----
              echo "🔹 Optimisation Laravel"
              php artisan optimize:clear
              php artisan optimize
              php artisan queue:restart || true
              php artisan up

              # ---- Redémarrage services ----
              echo "🔹 Redémarrage PHP-FPM"
              sudo systemctl restart php8.4-fpm

              echo "✅ Déploiement terminé : $(date)"
            else
              echo "⚠️ Aucun nouveau committ → déploiement ignoré"
            fi
